name: build pdf

on:
  push:
    branches: [main]
    paths:
      - "**/*.tex"
      - "Makefile"

env:
  PDF_FILE_NAME: Ahmad_Musafir_Khoirul_Fattah_FullStack_Backend_Focused.pdf

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xu-cheng/texlive-action@v2
        with:
          scheme: full
          run: latexmk -pdf main.tex

      - name: Rename PDF
        run: mv main.pdf ${{ env.PDF_FILE_NAME }}

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cv.pdf
          path: ${{ env.PDF_FILE_NAME }}

      # one-time cleanup of an abandoned asset; no-op once gone
      - name: Remove stale main.pdf asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset_id=$(gh api repos/${{ github.repository }}/releases/tags/latest \
            --jq '.assets[] | select(.name == "main.pdf") | .id')
          if [ -n "$asset_id" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$asset_id"
            echo "Deleted stale asset main.pdf ($asset_id)"
          else
            echo "No stale main.pdf asset found"
          fi

      - name: Delete existing asset with current name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset_id=$(gh api repos/${{ github.repository }}/releases/tags/latest \
            --jq ".assets[] | select(.name == \"$PDF_FILE_NAME\") | .id")
          if [ -n "$asset_id" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$asset_id"
            echo "Deleted existing asset $PDF_FILE_NAME ($asset_id)"
          fi

      - name: Create/Update Release
        uses: softprops/action-gh-release@v3.0.2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          files: ${{ env.PDF_FILE_NAME }}
          prerelease: false
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
